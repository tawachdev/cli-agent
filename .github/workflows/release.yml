name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: tag matches every version site
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $version — cut releases with: bun run release"
            exit 1
          fi
      - run: bun run check
      - name: compile all targets (cross-compile from linux)
        run: |
          for target in bun-darwin-arm64 bun-darwin-x64 bun-linux-arm64 bun-linux-x64; do
            bun build --compile bin/agent.ts --target "$target" --outfile "dist/agent-${target#bun-}"
          done
      - name: checksums
        run: |
          cd dist
          for f in agent-*; do
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/agent-*
          generate_release_notes: true
