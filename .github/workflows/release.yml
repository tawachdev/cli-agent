name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun test
      - name: compile all targets (cross-compile from linux)
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            bun build --compile bin/agent.ts --target "$target" --outfile "dist/agent-$target"
          done
      - name: checksums
        run: |
          cd dist
          for f in agent-*; do
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/agent-*
          generate_release_notes: true
